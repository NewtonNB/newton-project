<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Events - Nyabikoni Secondary School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="modern-footer.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<style>
/* Modern Events Page - Matching O-Level/A-Level Design */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', Arial, Helvetica, sans-serif;
}

body {
  color: #333;
  background: linear-gradient(135deg, #f8f9fa 60%, #e3f0ff 100%);
  min-height: 100vh;
}

/* Hero Section */
.events-hero {
  min-height: 50vh;
  width: 100%;
  background: url('nyabzgallery/current.jpg') center center/cover no-repeat;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 0;
  padding-top: 80px;
  padding-bottom: 60px;
  box-shadow: 0 8px 32px rgba(102,126,234,0.15);
  border-radius: 0 0 24px 24px;
  overflow: hidden;
}

.events-hero-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(120deg, rgba(102,126,234,0.85) 0%, rgba(118,75,162,0.7) 100%);
  backdrop-filter: blur(2.5px);
  z-index: 1;
  border-radius: 0 0 24px 24px;
}

.events-hero-text {
  position: relative;
  z-index: 2;
  text-align: center;
  color: #fff;
  padding: 40px 20px;
  max-width: 800px;
  margin: 0 auto;
}

.events-hero-title {
  font-family: 'Bungee', cursive;
  font-size: 2.8rem;
  margin-bottom: 1rem;
  letter-spacing: 1.5px;
  text-shadow: 0 2px 12px rgba(102,126,234,0.25), 0 4px 24px rgba(0,0,0,0.18);
  font-weight: 900;
  color: #fff;
}

.events-hero-subtitle {
  font-size: 1.2rem;
  color: #e3f2fd;
  max-width: 700px;
  margin: 0 auto 1.5rem;
  text-shadow: 0 1px 6px rgba(102,126,234,0.12), 0 2px 8px rgba(0,0,0,0.10);
  font-weight: 500;
  letter-spacing: 0.5px;
  line-height: 1.7;
}

.events-hero-btn {
  background: linear-gradient(135deg, #ffd700 0%, #fbc531 100%);
  color: #222;
  border: none;
  padding: 14px 35px;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,215,0,0.3);
  transition: all 0.3s ease;
  text-decoration: none;
  display: inline-block;
}

.events-hero-btn:hover {
  background: linear-gradient(135deg, #fbc531 0%, #ffd700 100%);
  transform: translateY(-3px);
  box-shadow: 0 6px 24px rgba(255,215,0,0.4);
  color: #222;
}

/* Statistics Cards */
.stats-container {
  max-width: 1200px;
  margin: 60px auto 80px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 35px;
  position: relative;
  z-index: 5;
}

.stat-card {
  background: white;
  padding: 35px 25px;
  border-radius: 16px;
  box-shadow: 0 6px 30px rgba(0,0,0,0.1);
  text-align: center;
  transition: all 0.3s ease;
  border: 2px solid transparent;
}

.stat-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 40px rgba(102,126,234,0.2);
  border-color: #667eea;
}

.stat-card .icon {
  font-size: 3rem;
  color: #667eea;
  margin-bottom: 15px;
  transition: transform 0.3s ease;
}

.stat-card:hover .icon {
  transform: scale(1.15);
}

.stat-card .number {
  font-size: 2.5rem;
  font-weight: 700;
  color: #764ba2;
  margin: 10px 0;
  line-height: 1;
}

.stat-card .label {
  font-size: 0.95rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  margin-top: 8px;
}

/* Search and Filter Bar */
.search-filter-container {
  max-width: 1000px;
  margin: 0 auto 80px;
  padding: 0 20px;
}

.search-filter-box {
  display: flex;
  gap: 15px;
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 6px 30px rgba(0,0,0,0.1);
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
}

.search-filter-box input,
.search-filter-box select {
  flex: 1;
  min-width: 200px;
  border: 2px solid #667eea;
  padding: 14px 20px;
  font-size: 1rem;
  outline: none;
  border-radius: 12px;
  background: #f8f9fa;
  transition: all 0.3s ease;
}

.search-filter-box input:focus,
.search-filter-box select:focus {
  border-color: #764ba2;
  background: white;
  box-shadow: 0 0 0 4px rgba(118,75,162,0.1);
}

.search-filter-box button {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 14px 30px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  border-radius: 12px;
  font-size: 1rem;
}

.search-filter-box button:hover {
  background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
  transform: scale(1.05);
  box-shadow: 0 6px 24px rgba(102,126,234,0.3);
}

.search-filter-box button i {
  margin-right: 5px;
}

/* Events Grid */
.events-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px 100px;
}

.events-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 40px;
}

/* Event Card */
.event-card {
  background: white;
  border-radius: 20px;
  box-shadow: 0 6px 30px rgba(102,126,234,0.12);
  overflow: hidden;
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  position: relative;
  border: 2px solid transparent;
}

.event-card:hover {
  transform: translateY(-12px);
  box-shadow: 0 12px 40px rgba(102,126,234,0.2);
  border-color: #667eea;
}

.event-card-image {
  width: 100%;
  height: 220px;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.event-card:hover .event-card-image {
  transform: scale(1.08);
}

.event-date-badge {
  position: absolute;
  top: 15px;
  left: 15px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 12px 15px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(102,126,234,0.3);
  z-index: 2;
  border: 3px solid white;
}

.event-date-badge .day {
  font-size: 1.8rem;
  font-weight: 700;
  display: block;
  line-height: 1;
}

.event-date-badge .month {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  opacity: 0.9;
}

.event-card-body {
  padding: 25px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.event-category-badge {
  display: inline-block;
  background: linear-gradient(135deg, #ffd700 0%, #fbc531 100%);
  color: #222;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 20px;
  padding: 6px 16px;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  align-self: flex-start;
}

.event-card-title {
  font-family: 'Bungee', cursive;
  color: #667eea;
  font-size: 1.3rem;
  margin-bottom: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1.3;
}

.event-card-meta {
  color: #666;
  font-size: 0.95rem;
  margin-bottom: 12px;
  line-height: 1.8;
}

.event-card-meta i {
  color: #667eea;
  margin-right: 8px;
  width: 16px;
}

.event-card-excerpt {
  color: #555;
  font-size: 1rem;
  line-height: 1.6;
  margin-bottom: 15px;
  flex: 1;
}

.event-card-btn {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}

.event-card-btn:hover {
  background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
  transform: scale(1.05);
  color: white;
}

/* Loading State */
.loading-container {
  text-align: center;
  padding: 60px 20px;
  grid-column: 1 / -1;
}

.spinner-border {
  width: 3rem;
  height: 3rem;
  border-width: 0.3em;
}

/* Empty State */
.no-events {
  text-align: center;
  padding: 60px 20px;
  color: #666;
  grid-column: 1 / -1;
  background: white;
  border-radius: 18px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}

.no-events i {
  font-size: 4rem;
  color: #667eea;
  margin-bottom: 20px;
}

.no-events h3 {
  color: #667eea;
  margin-bottom: 15px;
  font-family: 'Bungee', cursive;
}

.no-events p {
  font-size: 1.1rem;
  line-height: 1.6;
}

/* Back to Top Button */
.back-to-top {
  position: fixed;
  bottom: 32px;
  right: 32px;
  z-index: 999;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 56px;
  height: 56px;
  box-shadow: 0 4px 16px rgba(102,126,234,0.3);
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  opacity: 0;
  visibility: hidden;
}

.back-to-top.show {
  opacity: 1;
  visibility: visible;
}

.back-to-top:hover {
  background: linear-gradient(135deg, #5a67d8, #6b46c1);
  transform: translateY(-5px);
  box-shadow: 0 6px 24px rgba(102,126,234,0.4);
}

/* Responsive Design */
@media (max-width: 768px) {
  .events-hero {
    min-height: 40vh;
    padding-top: 70px;
    padding-bottom: 40px;
  }
  
  .events-hero-title {
    font-size: 1.9rem;
  }
  
  .events-hero-subtitle {
    font-size: 1rem;
  }
  
  .events-hero-text {
    padding: 20px 15px;
  }
  
  .stats-container {
    margin: 40px auto 60px;
    gap: 25px;
    grid-template-columns: 1fr;
  }
  
  .search-filter-container {
    margin: 0 auto 60px;
  }
  
  .search-filter-box {
    flex-direction: column;
  }
  
  .search-filter-box input,
  .search-filter-box select,
  .search-filter-box button {
    width: 100%;
  }
  
  .events-section {
    padding: 0 15px 80px;
  }
  
  .events-grid {
    grid-template-columns: 1fr;
    gap: 30px;
  }
  
  .back-to-top {
    width: 48px;
    height: 48px;
    font-size: 1.2rem;
    bottom: 20px;
    right: 20px;
  }
}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>

<!-- Hero Section -->
<section class="events-hero" aria-label="Events Hero">
  <div class="events-hero-overlay"></div>
  <div class="events-hero-text" data-aos="fade-down" data-aos-duration="1200">
    <h1 class="events-hero-title">NEWS & EVENTS</h1>
    <p class="events-hero-subtitle">
      Stay up to date with the latest news, events, and celebrations at <strong style="color:#ffd700;">Nyabikoni Secondary School</strong>. From academic milestones to vibrant community gatherings, discover what makes our school special.
    </p>
    <a href="#events" class="events-hero-btn">
      <i class="fas fa-calendar-alt"></i> See Upcoming Events
    </a>
  </div>
</section>

<!-- Statistics -->
<div class="stats-container" data-aos="fade-up" data-aos-delay="100">
  <div class="stat-card">
    <div class="icon"><i class="fas fa-calendar-check"></i></div>
    <div class="number" id="totalEvents">0</div>
    <div class="label">Total Events</div>
  </div>
  <div class="stat-card">
    <div class="icon"><i class="fas fa-bullhorn"></i></div>
    <div class="number" id="upcomingEvents">0</div>
    <div class="label">Upcoming</div>
  </div>
  <div class="stat-card">
    <div class="icon"><i class="fas fa-newspaper"></i></div>
    <div class="number" id="totalNews">0</div>
    <div class="label">News Items</div>
  </div>
</div>

<!-- Search and Filter -->
<div class="search-filter-container" data-aos="fade-up" data-aos-delay="200" id="events">
  <div class="search-filter-box">
    <select id="categoryFilter" onchange="filterEvents()">
      <option value="">All Categories</option>
      <option value="General">General</option>
      <option value="Event">Event</option>
      <option value="Holiday">Holiday</option>
      <option value="Exam">Exam</option>
      <option value="News">News</option>
      <option value="Other">Other</option>
    </select>
    <input type="text" 
           id="searchInput" 
           placeholder="Search by title, content, or date..." 
           onkeyup="filterEvents()">
    <button onclick="filterEvents()">
      <i class="fas fa-search"></i> Search
    </button>
  </div>
</div>

<!-- Events Grid -->
<section class="events-section" aria-label="Events">
  <div class="events-grid" id="eventsContainer">
    <!-- Loading spinner -->
    <div class="loading-container">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3">Loading events...</p>
    </div>
  </div>
</section>

<!-- Back to Top Button -->
<button onclick="scrollToTop()" class="back-to-top" id="backToTop" aria-label="Back to Top">
  <i class="fas fa-arrow-up"></i>
</button>

<!-- Scripts -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init({
  duration: 900,
  easing: 'ease-in-out',
  once: true
});

let allEvents = [];

// Load events on page load
document.addEventListener('DOMContentLoaded', function() {
  loadEvents();
  
  // Show/hide back to top button
  window.addEventListener('scroll', function() {
    const backToTop = document.getElementById('backToTop');
    if (window.scrollY > 300) {
      backToTop.classList.add('show');
    } else {
      backToTop.classList.remove('show');
    }
  });
});

async function loadEvents() {
  const container = document.getElementById('eventsContainer');
  
  try {
    const response = await fetch('../backend/get_events_public.php');
    const data = await response.json();
    
    // Remove loading spinner
    container.innerHTML = '';
    
    if (data.success && data.events && data.events.length > 0) {
      allEvents = data.events;
      
      // Update statistics
      updateStatistics(allEvents);
      
      // Display all events
      displayEvents(allEvents);
    } else {
      container.innerHTML = `
        <div class="no-events" data-aos="fade-in">
          <i class="fas fa-calendar-times"></i>
          <h3>No Events Available</h3>
          <p>There are currently no events or announcements. Please check back later!</p>
        </div>
      `;
    }
  } catch (error) {
    console.error('Error loading events:', error);
    container.innerHTML = `
      <div class="no-events" data-aos="fade-in">
        <i class="fas fa-exclamation-circle" style="color:#dc3545;"></i>
        <h3 style="color:#dc3545;">Error Loading Events</h3>
        <p>Unable to load events. Please try refreshing the page.</p>
      </div>
    `;
  }
}

function updateStatistics(events) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  
  const totalEvents = events.length;
  const upcomingEvents = events.filter(e => {
    if (!e.date) return false;
    const eventDate = new Date(e.date);
    return eventDate >= today;
  }).length;
  
  const totalNews = events.filter(e => e.category === 'News' || e.category === 'General').length;
  
  document.getElementById('totalEvents').textContent = totalEvents;
  document.getElementById('upcomingEvents').textContent = upcomingEvents;
  document.getElementById('totalNews').textContent = totalNews;
}

function displayEvents(events) {
  const container = document.getElementById('eventsContainer');
  
  if (events.length > 0) {
    container.innerHTML = events.map((event, index) => {
      // Parse date
      const eventDate = event.date ? new Date(event.date) : null;
      const day = eventDate ? eventDate.getDate() : '';
      const month = eventDate ? eventDate.toLocaleDateString('en-US', { month: 'short' }) : '';
      
      // Get first image from gallery or use default
      let imageUrl = 'nyabzgallery/current.jpg'; // Default image
      if (event.gallery_array && event.gallery_array.length > 0) {
        imageUrl = '../backend/' + event.gallery_array[0];
      }
      
      // Format speakers
      let speakers = '';
      if (event.speakers_array && event.speakers_array.length > 0) {
        speakers = event.speakers_array.join(', ');
      }
      
      // Truncate content for excerpt
      const excerpt = event.content ? 
        (event.content.length > 120 ? event.content.substring(0, 120) + '...' : event.content) : 
        'No description available.';
      
      return `
        <div class="event-card" data-aos="fade-up" data-aos-delay="${Math.min(index * 50, 500)}">
          ${eventDate ? `
          <div class="event-date-badge">
            <span class="day">${day}</span>
            <span class="month">${month}</span>
          </div>
          ` : ''}
          <img src="${imageUrl}" alt="${event.title}" class="event-card-image" loading="lazy">
          <div class="event-card-body">
            ${event.category ? `<span class="event-category-badge">${event.category}</span>` : ''}
            <h3 class="event-card-title">${event.title}</h3>
            <div class="event-card-meta">
              ${event.time ? `<div><i class="fas fa-clock"></i> ${event.time}</div>` : ''}
              ${event.location ? `<div><i class="fas fa-map-marker-alt"></i> ${event.location}</div>` : ''}
              ${speakers ? `<div><i class="fas fa-user"></i> ${speakers}</div>` : ''}
            </div>
            <p class="event-card-excerpt">${excerpt}</p>
            <a href="event_details.html?id=${event.id}" class="event-card-btn">
              <i class="fas fa-info-circle"></i> View Details
            </a>
          </div>
        </div>
      `;
    }).join('');
    
    // Reinitialize AOS
    if (typeof AOS !== 'undefined') {
      AOS.refresh();
    }
  } else {
    container.innerHTML = `
      <div class="no-events">
        <i class="fas fa-search"></i>
        <h3>No Results Found</h3>
        <p>No events match your search criteria. Try adjusting your filters.</p>
      </div>
    `;
  }
}

function filterEvents() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const category = document.getElementById('categoryFilter').value;
  
  let filtered = allEvents;
  
  // Filter by category
  if (category) {
    filtered = filtered.filter(event => event.category === category);
  }
  
  // Filter by search term
  if (searchTerm) {
    filtered = filtered.filter(event => {
      const title = (event.title || '').toLowerCase();
      const content = (event.content || '').toLowerCase();
      const date = (event.date || '').toLowerCase();
      const location = (event.location || '').toLowerCase();
      
      return title.includes(searchTerm) || 
             content.includes(searchTerm) || 
             date.includes(searchTerm) ||
             location.includes(searchTerm);
    });
  }
  
  displayEvents(filtered);
}

// Allow search on Enter key
document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    filterEvents();
  }
});

function scrollToTop() {
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}
</script>
<script src="js/includes.js"></script>
</body>
</html>
