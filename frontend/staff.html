<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaching Staff Gallery</title>
    <!-- Cleaned up CSS links -->
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="modern-footer.css">
    <!-- Font Awesome 6 for navbar icons -->

<style>
/* Staff Page Styles */
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    line-height: 1.6;
    color: #333;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
}

.header {
    background: linear-gradient(135deg, #2c5aa0 0%, #1e3a8a 100%);
    color: white;
    text-align: center;
    padding: 120px 0 80px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(44,90,160,0.10);
    border-radius: 0 0 24px 24px;
    margin-bottom: 2.5rem;
    z-index: 10;
}

.header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('./nyabzgallery/current.jpg') no-repeat center center/cover;
    opacity: 0.3;
    z-index: 1;
    border-radius: 0 0 24px 24px;
}

.text-box {
    position: relative;
    z-index: 2;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px;
}

.text-box h1 {
    font-family: 'Bungee', cursive;
    font-size: 3.5rem;
    margin-bottom: 1rem;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    color: #166f26;
    letter-spacing: 1.5px;
}

.gallery {
    padding: 4rem 0;
    background: transparent;
}

.gallery-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 3rem 2rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 2.5rem;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    backdrop-filter: blur(10px);
}

.teacher-card {
    background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: center;
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.5rem 2rem;
    position: relative;
    cursor: pointer;
}

.teacher-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #2c5aa0, #10b981);
    transform: scaleX(0);
    transition: transform 0.35s ease;
}

.teacher-card:hover::before {
    transform: scaleX(1);
}

.teacher-card:hover {
    transform: translateY(-12px);
    box-shadow: 0 20px 50px rgba(44,90,160,0.2);
    border-color: #2c5aa0;
}

.teacher-card .image-wrapper {
    position: relative;
    margin-bottom: 1.5rem;
}

.teacher-card img {
    border-radius: 50%;
    width: 140px;
    height: 140px;
    object-fit: cover;
    border: 4px solid #e8f0fe;
    background: #fff;
    box-shadow: 0 8px 24px rgba(44,90,160,0.12);
    transition: all 0.35s ease;
}

.teacher-card:hover img {
    border-color: #2c5aa0;
    transform: scale(1.08);
    box-shadow: 0 12px 32px rgba(44,90,160,0.25);
}

.teacher-card .image-wrapper::after {
    content: '\f51c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    bottom: -5px;
    right: calc(50% - 80px);
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #2c5aa0, #1e3a8a);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: white;
    box-shadow: 0 4px 12px rgba(44,90,160,0.3);
    transition: all 0.35s ease;
}

.teacher-card:hover .image-wrapper::after {
    transform: scale(1.15) rotate(10deg);
}

.teacher-card h3 {
    font-family: 'Poppins', sans-serif;
    color: #1e3a8a;
    font-size: 1.15rem;
    margin: 0.8rem 0 0.5rem 0;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.4;
    transition: color 0.3s ease;
}

.teacher-card:hover h3 {
    color: #2c5aa0;
}

.teacher-card .badge {
    display: inline-block;
    padding: 6px 16px;
    background: linear-gradient(135deg, #e8f0fe, #d3e4fd);
    color: #2c5aa0;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 0.5rem;
    transition: all 0.3s ease;
}

.teacher-card:hover .badge {
    background: linear-gradient(135deg, #2c5aa0, #1e3a8a);
    color: white;
    transform: scale(1.05);
}

.teaching-hero {
  min-height: 44vh;
  width: 100%;
  background-image: linear-gradient(rgba(44,90,160,0.85),rgba(16,185,129,0.85)), url('nyabzgallery/current.jpg');
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 32px rgba(44,90,160,0.10);
  border-radius: 0 0 24px 24px;
  margin-bottom: 2.5rem;
  margin-top: 0;
  padding-top: 80px;
  z-index: 10;
  position: relative;
  overflow: hidden;
}
.teaching-hero-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, rgba(44,90,160,0.85) 0%, rgba(16,185,129,0.85) 100%);
  z-index: 1;
  border-radius: 0 0 24px 24px;
}
.teaching-hero .text-box {
  position: relative;
  z-index: 2;
  text-align: center;
  color: #fff;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  padding: 40px 20px 40px 20px;
}
.page-title {
  font-family: 'Bungee', cursive;
  font-size: 2.7rem;
  color: #ffffff;
  margin-top: 2rem;
  margin-bottom: 0.5rem;
  text-align: center;
  letter-spacing: 1.5px;
  text-shadow: 2px 4px 12px rgba(0,0,0,0.4);
}
.hero-subtitle {
  font-size: 1.18rem;
  color: #ffffff;
  max-width: 600px;
  margin: 0 auto 1.5rem auto;
  opacity: 0.95;
  font-weight: 500;
  text-align: center;
  letter-spacing: 0.3px;
  text-shadow: 1px 2px 8px rgba(0,0,0,0.3);
}
@media (max-width: 700px) {
  .teaching-hero {
    min-height: 30vh;
    padding-top: 70px;
    padding-bottom: 20px;
    border-radius: 0 0 12px 12px;
    margin-top: 0;
  }
  .teaching-hero .page-title {
    font-size: 1.5rem;
  }
  .teaching-hero .text-box {
    padding: 20px 15px 20px 15px;
  }
}
@media (max-width: 900px) {
    .gallery-container {
        gap: 1.2rem;
        padding: 1.2rem 0.5rem;
    }
    .teacher-card {
        width: 45vw;
        min-width: 170px;
        max-width: 260px;
    }
}
@media (max-width: 600px) {
    .gallery-container {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 0 10px;
    }
    .teacher-card {
        width: 90vw;
        min-width: 140px;
        max-width: 98vw;
        padding: 1.2rem 0.5rem;
    }
    .text-box h1 {
        font-size: 2rem;
    }
    .header {
        padding: 100px 0 60px;
        border-radius: 0 0 12px 12px;
    }
}
/* Reduce navbar font size only for this page */
.navbar, .navbar .container {
    font-size: 15px !important;
}
.nav-link {
    font-size: 15px !important;
    padding: 0 12px !important;
}
.navbar-title, .navbar-title-marquee {
    font-size: 1em !important;
}

/* Statistics Cards */
.stats-container {
    max-width: 1200px;
    margin: -40px auto 40px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    position: relative;
    z-index: 5;
}

.stat-card {
    background: white;
    padding: 25px 20px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    transition: all 0.3s ease;
    border: 2px solid transparent;
}

.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 30px rgba(44,90,160,0.15);
    border-color: #2c5aa0;
}

.stat-card .icon {
    font-size: 2.5rem;
    color: #2c5aa0;
    margin-bottom: 10px;
    transition: transform 0.3s ease;
}

.stat-card:hover .icon {
    transform: scale(1.1);
}

.stat-card .number {
    font-size: 2.2rem;
    font-weight: 700;
    color: #166f26;
    margin: 5px 0;
    font-family: 'Poppins', sans-serif;
}

.stat-card .label {
    font-size: 0.9rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 500;
}

/* Search Bar */
.search-container {
    max-width: 600px;
    margin: 0 auto 40px;
    padding: 0 20px;
}

.search-box {
    display: flex;
    background: white;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transition: box-shadow 0.3s ease;
}

.search-box:focus-within {
    box-shadow: 0 6px 30px rgba(44,90,160,0.15);
}

.search-box input {
    flex: 1;
    border: none;
    padding: 15px 25px;
    font-size: 1rem;
    outline: none;
    font-family: 'Poppins', sans-serif;
}

.search-box button {
    background: linear-gradient(135deg, #2c5aa0 0%, #1e3a8a 100%);
    color: white;
    border: none;
    padding: 15px 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
}

.search-box button:hover {
    background: linear-gradient(135deg, #1e3a8a 0%, #2c5aa0 100%);
    transform: scale(1.05);
}

.search-box button i {
    margin-right: 5px;
}

/* Loading Spinner */
.spinner-border {
    width: 3rem;
    height: 3rem;
    border-width: 0.3em;
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    grid-column: 1 / -1;
}

.empty-state i {
    font-size: 4rem;
    color: #ccc;
    margin-bottom: 20px;
}

.empty-state p {
    font-size: 1.1rem;
    color: #777;
    font-style: italic;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .stats-container {
        margin: -20px auto 30px;
        gap: 15px;
    }
    
    .stat-card {
        padding: 20px 15px;
    }
    
    .stat-card .icon {
        font-size: 2rem;
    }
    
    .stat-card .number {
        font-size: 1.8rem;
    }
    
    .search-box {
        flex-direction: column;
        border-radius: 15px;
    }
    
    .search-box input, .search-box button {
        width: 100%;
        padding: 12px 20px;
    }
    
    .search-box button {
        border-radius: 0 0 15px 15px;
    }
}

/* Back to Top Button */
.back-to-top {
  position: fixed;
  bottom: 32px;
  right: 32px;
  z-index: 999;
  background: linear-gradient(135deg, #2c5aa0, #1e3a8a);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 56px;
  height: 56px;
  box-shadow: 0 4px 20px rgba(44,90,160,0.3);
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  opacity: 0;
  visibility: hidden;
}

.back-to-top.show {
  opacity: 1;
  visibility: visible;
}

.back-to-top:hover {
  background: linear-gradient(135deg, #1e3a8a, #2c5aa0);
  transform: translateY(-5px);
  box-shadow: 0 6px 25px rgba(44,90,160,0.4);
}

@media (max-width: 768px) {
  .back-to-top {
    width: 48px;
    height: 48px;
    bottom: 20px;
    right: 20px;
    font-size: 1.2rem;
  }
}
</style>    
</head>
<body>
<div id="navbar-placeholder"></div>
<section class="teaching-hero animate__animated animate__fadeInDown" aria-label="Teaching Staff Hero">
  <div class="teaching-hero-overlay"></div>
  <div class="text-box animate__animated animate__fadeInUp">
    <h1 class="page-title animate__animated animate__fadeInUp" style="animation-delay:0.1s;">Teaching Staff</h1>
    <p class="hero-subtitle animate__animated animate__fadeInUp" style="animation-delay:0.3s;">
      Meet our dedicated teaching staff who inspire, educate, and guide our students to excellence every day.
    </p>
  </div>
</section>

<!-- Statistics Cards -->
<div class="stats-container" data-aos="fade-up" data-aos-delay="100">
  <div class="stat-card">
    <div class="icon"><i class="fas fa-users"></i></div>
    <div class="number" id="totalTeachers">0</div>
    <div class="label">Teaching Staff</div>
  </div>
  <div class="stat-card">
    <div class="icon"><i class="fas fa-chalkboard-teacher"></i></div>
    <div class="number" id="totalTeachers">0</div>
    <div class="label">Educators</div>
  </div>
  <div class="stat-card">
    <div class="icon"><i class="fas fa-graduation-cap"></i></div>
    <div class="number" id="totalTeachers">0</div>
    <div class="label">Professionals</div>
  </div>
</div>

<!-- Search Bar -->
<div class="search-container" data-aos="fade-up" data-aos-delay="200">
  <div class="search-box">
    <input type="text" 
           id="searchInput" 
           placeholder="Search by name, subject, or email..." 
           onkeyup="handleSearch()">
    <button onclick="handleSearch()">
      <i class="fas fa-search"></i> Search
    </button>
  </div>
</div>
    
<section class="gallery">
  <div class="gallery-container" id="teachingStaffContainer">
    <!-- Loading spinner -->
    <div class="col-12 text-center" id="loadingSpinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2">Loading teaching staff...</p>
    </div>
    <!-- Staff cards will be dynamically loaded here -->
  </div>
</section>

<!-- Back to Top Button -->
<button onclick="scrollToTop()" class="back-to-top" id="backToTop" aria-label="Back to Top">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
let allTeachers = [];

document.addEventListener('DOMContentLoaded', function() {
  loadTeachingStaff();
});

async function loadTeachingStaff() {
  const container = document.getElementById('teachingStaffContainer');
  const spinner = document.getElementById('loadingSpinner');
  
  try {
    // Load gallery images for teachers category
    const response = await fetch('../backend/get_gallery_images.php');
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const data = await response.json();
    console.log('Gallery data loaded:', data);
    
    // Remove spinner
    if (spinner) spinner.remove();
    
    if (data.success && data.images) {
      // Filter only teacher category images
      const teacherImages = data.images.filter(img => img.category === 'teachers');
      console.log('Teacher images found:', teacherImages.length);
      
      if (teacherImages.length > 0) {
        // Transform gallery images to teacher format
        allTeachers = teacherImages.map((img, index) => ({
          full_name: img.caption || `Teacher ${index + 1}`,
          photo: img.filename,
          subject: 'Teacher',
          email: '',
          gender: '',
          photo_source: 'gallery'
        }));
        
        // Update statistics
        updateStatistics(allTeachers);
        
        // Display all teachers
        displayTeachers(allTeachers);
      } else {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i><p>No teaching staff photos found. Please upload photos with "Teachers" category in the gallery.</p></div>';
      }
    } else {
      console.error('Invalid response:', data);
      container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p style="color: #d32f2f;">Error: ${data.error || 'Unknown error'}</p></div>`;
    }
  } catch (error) {
    console.error('Error loading teaching staff:', error);
    if (spinner) spinner.remove();
    container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p style="color: #d32f2f;">Error loading staff data: ${error.message}</p><p style="font-size: 0.9rem; margin-top: 10px;">Check browser console for details.</p></div>`;
  }
}

function displayTeachers(teachers) {
  const container = document.getElementById('teachingStaffContainer');
  
  if (teachers.length > 0) {
    container.innerHTML = teachers.map((teacher, index) => {
      // Clean up the name from filename if needed
      let displayName = teacher.full_name;
      if (displayName.includes('.')) {
        // Extract caption or create a cleaner name
        displayName = displayName.split('.')[0].replace(/_/g, ' ').replace(/\d+/g, '').trim();
      }
      
      return `
      <div class="teacher-card" data-aos="fade-up" data-aos-delay="${Math.min(index * 50, 500)}">
        <div class="image-wrapper">
          <img src="nyabzgallery/${teacher.photo}" 
               alt="${displayName}"
               onerror="this.src='nyabzgallery/default.svg'"
               loading="lazy">
        </div>
        <h3>${displayName}</h3>
        <span class="badge">Teaching Staff</span>
      </div>
    `;
    }).join('');
    
    // Reinitialize AOS for new elements
    if (typeof AOS !== 'undefined') {
      AOS.refresh();
    }
  } else {
    container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No teachers match your search.</p></div>';
  }
}

function updateStatistics(teachers) {
  const total = teachers.length;
  
  // Update all stat cards with the same total count
  const totalElements = document.querySelectorAll('#totalTeachers');
  totalElements.forEach(el => {
    if (el) el.textContent = total;
  });
}

function handleSearch() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  
  if (searchTerm === '') {
    displayTeachers(allTeachers);
    return;
  }
  
  const filtered = allTeachers.filter(teacher => 
    teacher.full_name.toLowerCase().includes(searchTerm) ||
    (teacher.subject && teacher.subject.toLowerCase().includes(searchTerm)) ||
    (teacher.email && teacher.email.toLowerCase().includes(searchTerm))
  );
  
  displayTeachers(filtered);
}

// Allow search on Enter key
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });
  }
});
</script>

<script>
    function scrollToTop() {
window.scrollTo({
    top: 0, // Scroll to the top of the page
    behavior: 'smooth' // Smooth scrolling animation
});
}

// Show/hide back to top button based on scroll position
window.addEventListener('scroll', function() {
  const backToTopButton = document.getElementById('backToTop');
  if (backToTopButton) {
    if (window.pageYOffset > 300) {
      backToTopButton.classList.add('show');
    } else {
      backToTopButton.classList.remove('show');
    }
  }
});

AOS.init({
  duration: 800,
  easing: 'ease-in-out',
  once: true,
});

</script>
