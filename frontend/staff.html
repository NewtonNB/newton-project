<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaching Staff Gallery</title>
    <!-- Cleaned up CSS links -->
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="modern-footer.css">
    <!-- Font Awesome 6 for navbar icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts for Bungee and Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
/* Staff Page Styles */
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    line-height: 1.6;
    color: #333;
    background: linear-gradient(135deg, #f8f9fa 60%, #e3f0ff 100%);
    min-height: 100vh;
}

.header {
    background: linear-gradient(135deg, #2c5aa0 0%, #1e3a8a 100%);
    color: white;
    text-align: center;
    padding: 120px 0 80px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(44,90,160,0.10);
    border-radius: 0 0 24px 24px;
    margin-bottom: 2.5rem;
    z-index: 10;
}

.header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('./nyabzgallery/current.jpg') no-repeat center center/cover;
    opacity: 0.3;
    z-index: 1;
    border-radius: 0 0 24px 24px;
}

.text-box {
    position: relative;
    z-index: 2;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px;
}

.text-box h1 {
    font-family: 'Bungee', cursive;
    font-size: 3.5rem;
    margin-bottom: 1rem;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    color: #166f26;
    letter-spacing: 1.5px;
}

.gallery {
    padding: 4rem 0;
    background: transparent;
}

.gallery-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
}

.teacher-card {
    background: #f9f9f9;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(22,111,38,0.10);
    transition: transform 0.22s, box-shadow 0.22s, background 0.22s;
    text-align: center;
    border: 1.5px solid #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.2rem 1.2rem 1.5rem 1.2rem;
    margin-bottom: 0.5rem;
}

.teacher-card:hover {
    transform: translateY(-10px) scale(1.045);
    box-shadow: 0 10px 32px rgba(22,111,38,0.16);
    background: #f4fff7;
    border: 1.5px solid #10b981;
}

.teacher-card img {
    border-radius: 50%;
    width: 120px;
    height: 120px;
    object-fit: cover;
    margin-bottom: 1.1rem;
    border: 3px solid #e0e0e0;
    background: #fff;
    box-shadow: 0 2px 8px rgba(44,90,160,0.07);
    transition: box-shadow 0.22s, border 0.22s;
}

.teacher-card h3 {
    font-family: 'Bungee', cursive;
    color: #166f26;
    font-size: 1.13rem;
    margin: 0.5rem 0 0.2rem 0;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(44,90,160,0.04);
}

.teacher-card p {
    color: #555;
    font-size: 1.01rem;
    margin: 0;
    font-weight: 500;
    letter-spacing: 0.1px;
}

.teaching-hero {
  min-height: 44vh;
  width: 100%;
  background-image: linear-gradient(rgba(44,90,160,0.7),rgba(16,185,129,0.7)), url('nyabzgallery/current.jpg');
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 32px rgba(44,90,160,0.10);
  border-radius: 0 0 24px 24px;
  margin-bottom: 2.5rem;
  margin-top: 0;
  padding-top: 80px;
  z-index: 10;
  position: relative;
  overflow: hidden;
}
.teaching-hero-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, rgba(44,90,160,0.7) 0%, rgba(16,185,129,0.7) 100%);
  z-index: 1;
  border-radius: 0 0 24px 24px;
}
.teaching-hero .text-box {
  position: relative;
  z-index: 2;
  text-align: center;
  color: #fff;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  padding: 40px 20px 40px 20px;
}
.page-title {
  font-family: 'Bungee', cursive;
  font-size: 2.7rem;
  color: #166f26;
  margin-top: 2rem;
  margin-bottom: 0.5rem;
  text-align: center;
  letter-spacing: 1.5px;
  text-shadow: 0 2px 8px rgba(44,90,160,0.08);
}
.hero-subtitle {
  font-size: 1.18rem;
  color: #e5e7eb;
  max-width: 600px;
  margin: 0 auto 1.5rem auto;
  opacity: 0.97;
  font-weight: 500;
  text-align: center;
  letter-spacing: 0.2px;
}
@media (max-width: 700px) {
  .teaching-hero {
    min-height: 30vh;
    padding-top: 70px;
    padding-bottom: 20px;
    border-radius: 0 0 12px 12px;
    margin-top: 0;
  }
  .teaching-hero .page-title {
    font-size: 1.5rem;
  }
  .teaching-hero .text-box {
    padding: 20px 15px 20px 15px;
  }
}
@media (max-width: 900px) {
    .gallery-container {
        gap: 1.2rem;
        padding: 1.2rem 0.5rem;
    }
    .teacher-card {
        width: 45vw;
        min-width: 170px;
        max-width: 260px;
    }
}
@media (max-width: 600px) {
    .gallery-container {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 0 10px;
    }
    .teacher-card {
        width: 90vw;
        min-width: 140px;
        max-width: 98vw;
        padding: 1.2rem 0.5rem;
    }
    .text-box h1 {
        font-size: 2rem;
    }
    .header {
        padding: 100px 0 60px;
        border-radius: 0 0 12px 12px;
    }
}
/* Reduce navbar font size only for this page */
.navbar, .navbar .container {
    font-size: 15px !important;
}
.nav-link {
    font-size: 15px !important;
    padding: 0 12px !important;
}
.navbar-title, .navbar-title-marquee {
    font-size: 1em !important;
}

/* Statistics Cards */
.stats-container {
    max-width: 1200px;
    margin: -40px auto 40px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    position: relative;
    z-index: 5;
}

.stat-card {
    background: white;
    padding: 25px 20px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    transition: all 0.3s ease;
    border: 2px solid transparent;
}

.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 30px rgba(44,90,160,0.15);
    border-color: #2c5aa0;
}

.stat-card .icon {
    font-size: 2.5rem;
    color: #2c5aa0;
    margin-bottom: 10px;
    transition: transform 0.3s ease;
}

.stat-card:hover .icon {
    transform: scale(1.1);
}

.stat-card .number {
    font-size: 2.2rem;
    font-weight: 700;
    color: #166f26;
    margin: 5px 0;
    font-family: 'Poppins', sans-serif;
}

.stat-card .label {
    font-size: 0.9rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 500;
}

/* Search Bar */
.search-container {
    max-width: 600px;
    margin: 0 auto 40px;
    padding: 0 20px;
}

.search-box {
    display: flex;
    background: white;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transition: box-shadow 0.3s ease;
}

.search-box:focus-within {
    box-shadow: 0 6px 30px rgba(44,90,160,0.15);
}

.search-box input {
    flex: 1;
    border: none;
    padding: 15px 25px;
    font-size: 1rem;
    outline: none;
    font-family: 'Poppins', sans-serif;
}

.search-box button {
    background: linear-gradient(135deg, #2c5aa0 0%, #1e3a8a 100%);
    color: white;
    border: none;
    padding: 15px 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
}

.search-box button:hover {
    background: linear-gradient(135deg, #1e3a8a 0%, #2c5aa0 100%);
    transform: scale(1.05);
}

.search-box button i {
    margin-right: 5px;
}

/* Loading Spinner */
.spinner-border {
    width: 3rem;
    height: 3rem;
    border-width: 0.3em;
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    grid-column: 1 / -1;
}

.empty-state i {
    font-size: 4rem;
    color: #ccc;
    margin-bottom: 20px;
}

.empty-state p {
    font-size: 1.1rem;
    color: #777;
    font-style: italic;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .stats-container {
        margin: -20px auto 30px;
        gap: 15px;
    }
    
    .stat-card {
        padding: 20px 15px;
    }
    
    .stat-card .icon {
        font-size: 2rem;
    }
    
    .stat-card .number {
        font-size: 1.8rem;
    }
    
    .search-box {
        flex-direction: column;
        border-radius: 15px;
    }
    
    .search-box input, .search-box button {
        width: 100%;
        padding: 12px 20px;
    }
    
    .search-box button {
        border-radius: 0 0 15px 15px;
    }
}
</style>    
</head>
<body>
<div id="navbar-placeholder"></div>
<section class="teaching-hero animate__animated animate__fadeInDown" aria-label="Teaching Staff Hero">
  <div class="teaching-hero-overlay"></div>
  <div class="text-box animate__animated animate__fadeInUp">
    <h1 class="page-title animate__animated animate__fadeInUp" style="animation-delay:0.1s;">Teaching Staff</h1>
    <p class="hero-subtitle animate__animated animate__fadeInUp" style="animation-delay:0.3s;">
      Meet our dedicated teaching staff who inspire, educate, and guide our students to excellence every day.
    </p>
  </div>
</section>

<!-- Statistics Cards -->
<div class="stats-container" data-aos="fade-up" data-aos-delay="100">
  <div class="stat-card">
    <div class="icon"><i class="fas fa-chalkboard-teacher"></i></div>
    <div class="number" id="totalTeachers">0</div>
    <div class="label">Total Teachers</div>
  </div>
  <div class="stat-card">
    <div class="icon"><i class="fas fa-male"></i></div>
    <div class="number" id="maleTeachers">0</div>
    <div class="label">Male</div>
  </div>
  <div class="stat-card">
    <div class="icon"><i class="fas fa-female"></i></div>
    <div class="number" id="femaleTeachers">0</div>
    <div class="label">Female</div>
  </div>
</div>

<!-- Search Bar -->
<div class="search-container" data-aos="fade-up" data-aos-delay="200">
  <div class="search-box">
    <input type="text" 
           id="searchInput" 
           placeholder="Search by name, subject, or email..." 
           onkeyup="handleSearch()">
    <button onclick="handleSearch()">
      <i class="fas fa-search"></i> Search
    </button>
  </div>
</div>
    
<section class="gallery">
  <div class="gallery-container" id="teachingStaffContainer">
    <!-- Loading spinner -->
    <div class="col-12 text-center" id="loadingSpinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2">Loading teaching staff...</p>
    </div>
    <!-- Staff cards will be dynamically loaded here -->
  </div>
</section>

<script>
let allTeachers = [];

document.addEventListener('DOMContentLoaded', function() {
  loadTeachingStaff();
});

async function loadTeachingStaff() {
  const container = document.getElementById('teachingStaffContainer');
  const spinner = document.getElementById('loadingSpinner');
  
  try {
    const response = await fetch('../backend/get_teachers_public.php?page=1&perPage=100');
    const data = await response.json();
    
    // Load gallery images for teachers category
    let galleryImages = [];
    try {
      const galleryResponse = await fetch('../backend/get_gallery_images.php');
      const galleryData = await galleryResponse.json();
      if (galleryData.success && galleryData.images) {
        // Filter only teacher category images
        galleryImages = galleryData.images.filter(img => img.category === 'teachers');
      }
    } catch (error) {
      console.warn('Could not load gallery images:', error);
    }
    
    // Remove spinner
    if (spinner) spinner.remove();
    
    if (data.teachers && data.teachers.length > 0) {
      // Filter teaching staff (those with subjects, excluding admin roles)
      allTeachers = data.teachers.filter(teacher => 
        teacher.subject && 
        teacher.subject.trim() !== '' &&
        !teacher.subject.toLowerCase().includes('headmaster') &&
        !teacher.subject.toLowerCase().includes('deputy') &&
        !teacher.subject.toLowerCase().includes('bursar') &&
        !teacher.subject.toLowerCase().includes('accountant') &&
        !teacher.subject.toLowerCase().includes('secretary')
      );
      
      // Match teachers with gallery images if they don't have photos
      allTeachers = allTeachers.map((teacher, index) => {
        if (!teacher.photo && galleryImages.length > 0) {
          // Assign gallery image (round-robin distribution)
          const galleryImage = galleryImages[index % galleryImages.length];
          teacher.photo = galleryImage.filename;
          teacher.photo_source = 'gallery';
        }
        return teacher;
      });
      
      // Update statistics
      updateStatistics(allTeachers);
      
      // Display all teachers
      displayTeachers(allTeachers);
      
    } else {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i><p>No teaching staff found in the database.</p></div>';
    }
  } catch (error) {
    console.error('Error loading teaching staff:', error);
    if (spinner) spinner.remove();
    container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p style="color: #d32f2f;">Error loading staff data. Please try again later.</p></div>';
  }
}

function displayTeachers(teachers) {
  const container = document.getElementById('teachingStaffContainer');
  
  if (teachers.length > 0) {
    container.innerHTML = teachers.map((teacher, index) => `
      <div class="teacher-card" data-aos="fade-up" data-aos-delay="${Math.min(index * 50, 500)}">
        <img src="${teacher.photo ? 'nyabzgallery/' + teacher.photo : 'nyabzgallery/default.svg'}" 
             alt="${teacher.full_name}"
             onerror="this.src='nyabzgallery/default.svg'">
        <h3>${teacher.full_name.toUpperCase()}</h3>
        <p><i class="fas fa-book"></i> ${teacher.subject}</p>
        ${teacher.email ? `<small style="color: #666; font-size: 0.85rem; display: block; margin-top: 8px;"><i class="fas fa-envelope"></i> ${teacher.email}</small>` : ''}
      </div>
    `).join('');
    
    // Reinitialize AOS for new elements
    if (typeof AOS !== 'undefined') {
      AOS.refresh();
    }
  } else {
    container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No teachers match your search.</p></div>';
  }
}

function updateStatistics(teachers) {
  const total = teachers.length;
  const male = teachers.filter(t => t.gender && t.gender.toLowerCase() === 'male').length;
  const female = teachers.filter(t => t.gender && t.gender.toLowerCase() === 'female').length;
  
  document.getElementById('totalTeachers').textContent = total;
  document.getElementById('maleTeachers').textContent = male;
  document.getElementById('femaleTeachers').textContent = female;
}

function handleSearch() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  
  if (searchTerm === '') {
    displayTeachers(allTeachers);
    return;
  }
  
  const filtered = allTeachers.filter(teacher => 
    teacher.full_name.toLowerCase().includes(searchTerm) ||
    (teacher.subject && teacher.subject.toLowerCase().includes(searchTerm)) ||
    (teacher.email && teacher.email.toLowerCase().includes(searchTerm))
  );
  
  displayTeachers(filtered);
}

// Allow search on Enter key
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });
  }
});
</script>


<script>
        
    function showMenu() {
        document.getElementById('navlinks').style.right = "0";
    }

    function hideMenu() {
        document.getElementById('navlinks').style.right = "-200px";
    }


    </script>


<!-- AOS.js -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  AOS.init();
</script>

window.scrollTo({
    top: 0, // Scroll to the top of the page

}

  duration: 800,
  easing: 'ease-in-out',
  once: true,
});

</script>

    function toggleFab() {
      const fabOptions = document.querySelector('.fab-options');
      fabOptions.classList.toggle('show');
    }
    </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/includes.js"></script>
</body>
