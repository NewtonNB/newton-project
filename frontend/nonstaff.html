<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaching Staff Gallery</title>
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="modern-footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
  rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<style>
@import url('https:fonts.googleapis.com/css?family=Poppins:200,300,400,500,600,700,800,900&display=swap');

/* Modern Hero Section for Non-Teaching Staff */
.nonstaff-hero {
    position: relative;
    min-height: 50vh;
    width: 100%;
    background-image: linear-gradient(rgba(44,90,160,0.85),rgba(16,185,129,0.85)), url('nyabzgallery/current.jpg');
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 0;
    margin-bottom: 2.5rem;
    padding-top: 80px;
    padding-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(44,90,160,0.10);
    border-radius: 0 0 24px 24px;
}

.nonstaff-hero-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, rgba(44,90,160,0.85) 0%, rgba(16,185,129,0.85) 100%);
    z-index: 1;
    border-radius: 0 0 24px 24px;
}

.nonstaff-hero .text-box {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 20px 40px 20px;
    color: #fff;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

.nonstaff-hero .page-title {
    font-family: 'Bungee', cursive;
    font-size: 2.7rem;
    color: #ffffff;
    margin-top: 2rem;
    margin-bottom: 0.5rem;
    text-align: center;
    letter-spacing: 1.5px;
    text-shadow: 2px 4px 12px rgba(0,0,0,0.4);
}

.hero-subtitle {
    font-size: 1.18rem;
    color: #ffffff;
    max-width: 600px;
    margin: 0 auto 1.5rem auto;
    opacity: 0.95;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.3px;
    text-shadow: 1px 2px 8px rgba(0,0,0,0.3);
}

.divider {
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, #2c5aa0 0%, #10b981 100%);
    border-radius: 2px;
    margin: 0 auto 2.5rem auto;
    opacity: 0.18;
}

body {
  font-family: 'Poppins', 'Roboto', Arial, sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  color: #222;
  margin: 0;
  padding: 0;
  min-height: 100vh;
}

/* Statistics Cards */
.stats-container {
    max-width: 1200px;
    margin: -40px auto 40px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    position: relative;
    z-index: 5;
}

.stat-card {
    background: white;
    padding: 30px 25px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    text-align: center;
    transition: all 0.3s ease;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #2c5aa0, #10b981);
    transform: scaleX(0);
    transition: transform 0.3s ease;
}

.stat-card:hover::before {
    transform: scaleX(1);
}

.stat-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 35px rgba(44,90,160,0.18);
    border-color: #2c5aa0;
}

.stat-card .icon {
    font-size: 2.8rem;
    color: #2c5aa0;
    margin-bottom: 15px;
    transition: transform 0.3s ease;
}

.stat-card:hover .icon {
    transform: scale(1.15) rotate(5deg);
}

.stat-card .number {
    font-size: 2.5rem;
    font-weight: 700;
    color: #166f26;
    margin: 8px 0;
    font-family: 'Poppins', sans-serif;
}

.stat-card .label {
    font-size: 0.95rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
}

/* Search Bar */
.search-container {
    max-width: 600px;
    margin: 0 auto 40px;
    padding: 0 20px;
}

.search-box {
    display: flex;
    background: white;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 6px 25px rgba(0,0,0,0.1);
    transition: box-shadow 0.3s ease;
    border: 2px solid transparent;
}

.search-box:focus-within {
    box-shadow: 0 8px 35px rgba(44,90,160,0.2);
    border-color: #2c5aa0;
}

.search-box input {
    flex: 1;
    border: none;
    padding: 16px 28px;
    font-size: 1rem;
    outline: none;
    font-family: 'Poppins', sans-serif;
}

.search-box button {
    background: linear-gradient(135deg, #2c5aa0 0%, #1e3a8a 100%);
    color: white;
    border: none;
    padding: 16px 32px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 600;
}

.search-box button:hover {
    background: linear-gradient(135deg, #1e3a8a 0%, #2c5aa0 100%);
    transform: scale(1.05);
}

.search-box button i {
    margin-right: 6px;
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    width: 100%;
}

.empty-state i {
    font-size: 4rem;
    color: #ccc;
    margin-bottom: 20px;
}

.empty-state p {
    font-size: 1.1rem;
    color: #777;
    font-style: italic;
}

.gallery-section {
  padding: 2.5rem 0 3rem 0;
}

.container.gallery-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 2.5rem;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  padding: 3rem 2rem;
  margin: 0 auto;
  max-width: 1400px;
  backdrop-filter: blur(10px);
}

.staff-item {
    background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    padding: 2.5rem 1.5rem 2rem;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 2px solid transparent;
    position: relative;
    cursor: pointer;
}

.staff-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #10b981, #2c5aa0);
    transform: scaleX(0);
    transition: transform 0.35s ease;
}

.staff-item:hover::before {
    transform: scaleX(1);
}

.staff-item .image-wrapper {
    position: relative;
    margin-bottom: 1.5rem;
}

.staff-item img {
    border-radius: 50%;
    width: 140px;
    height: 140px;
    object-fit: cover;
    border: 4px solid #e8f0fe;
    background: #fff;
    box-shadow: 0 8px 24px rgba(16,185,129,0.12);
    transition: all 0.35s ease;
}

.staff-item:hover img {
    border-color: #10b981;
    transform: scale(1.08);
    box-shadow: 0 12px 32px rgba(16,185,129,0.25);
}

.staff-item .image-wrapper::after {
    content: '\f508';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    bottom: -5px;
    right: calc(50% - 80px);
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: white;
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
    transition: all 0.35s ease;
}

.staff-item:hover .image-wrapper::after {
    transform: scale(1.15) rotate(-10deg);
}

.staff-item h3 {
    font-size: 1.15rem;
    color: #1e3a8a;
    margin: 0.8rem 0 0.5rem 0;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.4;
    transition: color 0.3s ease;
}

.staff-item:hover h3 {
    color: #10b981;
}

.staff-item .badge {
    display: inline-block;
    padding: 6px 16px;
    background: linear-gradient(135deg, #d1fae5, #a7f3d0);
    color: #059669;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 0.5rem;
    transition: all 0.3s ease;
}

.staff-item:hover .badge {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    transform: scale(1.05);
}

.staff-item:hover {
    transform: translateY(-12px);
    box-shadow: 0 20px 50px rgba(16,185,129,0.2);
    border-color: #10b981;
}

/* Back to Top Button */
.back-to-top {
  position: fixed;
  bottom: 32px;
  right: 32px;
  z-index: 999;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 56px;
  height: 56px;
  box-shadow: 0 4px 20px rgba(16,185,129,0.3);
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  opacity: 0;
  visibility: hidden;
}

.back-to-top.show {
  opacity: 1;
  visibility: visible;
}

.back-to-top:hover {
  background: linear-gradient(135deg, #059669, #10b981);
  transform: translateY(-5px);
  box-shadow: 0 6px 25px rgba(16,185,129,0.4);
}

@media (max-width: 768px) {
  .back-to-top {
    width: 48px;
    height: 48px;
    bottom: 20px;
    right: 20px;
    font-size: 1.2rem;
  }
}

@media (max-width: 900px) {
    .stats-container {
        margin: -20px auto 30px;
        gap: 15px;
    }
    
    .stat-card {
        padding: 20px 15px;
    }
    
    .stat-card .icon {
        font-size: 2rem;
    }
    
    .stat-card .number {
        font-size: 1.8rem;
    }
    
    .container.gallery-container {
        gap: 1.2rem;
        padding: 1.2rem 0.5rem;
    }
    .staff-item {
        width: 45vw;
        min-width: 170px;
        max-width: 260px;
    }
}
@media (max-width: 600px) {
    .search-box {
        flex-direction: column;
        border-radius: 15px;
    }
    
    .search-box input, .search-box button {
        width: 100%;
        padding: 12px 20px;
    }
    
    .search-box button {
        border-radius: 0 0 15px 15px;
    }
    
    .container.gallery-container {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem 0.2rem;
    }
    .staff-item {
        width: 90vw;
        min-width: 140px;
        max-width: 98vw;
        padding: 1.2rem 0.5rem;
    }
    .page-title {
        font-size: 2rem;
    }
    .nonstaff-hero {
        border-radius: 0 0 12px 12px;
        padding-top: 70px;
        padding-bottom: 20px;
        min-height: 35vh;
        margin-top: 0;
    }
    .nonstaff-hero .text-box {
        padding: 20px 15px 20px 15px;
    }
}

</style>
</head>
<body>
<div id="navbar-placeholder"></div>

<main>
    <section class="header nonstaff-hero" aria-label="Non-Teaching Staff Hero">
        <div class="nonstaff-hero-overlay animate__animated animate__fadeInDown" style="animation-delay:0.05s;"></div>
        <div class="text-box animate__animated animate__fadeInDown">
            <h1 class="page-title animate__animated animate__fadeInUp" style="animation-delay: 0.1s;">Non-Teaching Staff</h1>
            <p class="hero-subtitle animate__animated animate__fadeInUp" style="animation-delay: 0.3s;">
                Meet our dedicated non-teaching staff who support the smooth running of Nyabikoni Secondary School and contribute to our culture of excellence.
            </p>
        </div>
    </section>

    <!-- Statistics Cards -->
    <div class="stats-container" data-aos="fade-up" data-aos-delay="100">
        <div class="stat-card">
            <div class="icon"><i class="fas fa-users-cog"></i></div>
            <div class="number" id="totalStaff">0</div>
            <div class="label">Support Staff</div>
        </div>
        <div class="stat-card">
            <div class="icon"><i class="fas fa-user-tie"></i></div>
            <div class="number" id="adminStaff">0</div>
            <div class="label">Administrative</div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container" data-aos="fade-up" data-aos-delay="200">
        <div class="search-box">
            <input type="text" 
                   id="searchInput" 
                   placeholder="Search by name, role, or email..." 
                   onkeyup="handleSearch()">
            <button onclick="handleSearch()">
                <i class="fas fa-search"></i> Search
            </button>
        </div>
    </div>

    <section class="gallery-section animate__animated animate__fadeInUp" style="animation-delay:0.2s;">
        <div class="divider"></div>
        <div class="container gallery-container" id="nonTeachingStaffContainer">
            <!-- Loading spinner -->
            <div style="width: 100%; text-align: center; padding: 40px;" id="loadingSpinner">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Loading non-teaching staff...</p>
            </div>
        </div>
    </section>
</main>

<!-- Back to Top Button -->
<button onclick="scrollToTop()" class="back-to-top" id="backToTop" aria-label="Back to Top">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
let allStaff = [];

document.addEventListener('DOMContentLoaded', function() {
    loadNonTeachingStaff();
});

async function loadNonTeachingStaff() {
    const container = document.getElementById('nonTeachingStaffContainer');
    const spinner = document.getElementById('loadingSpinner');
    
    try {
        // Load gallery images for nonteachers category
        const response = await fetch('../backend/get_gallery_images.php');
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('Gallery data loaded:', data);
        
        // Remove spinner
        if (spinner) spinner.remove();
        
        if (data.success && data.images) {
            // Filter only nonteachers category images
            const nonTeacherImages = data.images.filter(img => img.category === 'nonteachers');
            console.log('Non-teacher images found:', nonTeacherImages.length);
            
            if (nonTeacherImages.length > 0) {
                // Transform gallery images to staff format
                allStaff = nonTeacherImages.map((img, index) => ({
                    full_name: img.caption || `Staff ${index + 1}`,
                    photo: img.filename,
                    subject: 'Support Staff',
                    email: '',
                    phone: '',
                    photo_source: 'gallery'
                }));
                
                // Update statistics
                updateStatistics(allStaff);
                
                // Display all staff
                displayStaff(allStaff);
            } else {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i><p>No non-teaching staff photos found. Please upload photos with "Non-Teachers" category in the gallery.</p></div>';
            }
        } else {
            console.error('Invalid response:', data);
            container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p style="color: #d32f2f;">Error: ${data.error || 'Unknown error'}</p></div>`;
        }
    } catch (error) {
        console.error('Error loading non-teaching staff:', error);
        if (spinner) spinner.remove();
        container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p style="color: #d32f2f;">Error loading staff data: ${error.message}</p><p style="font-size: 0.9rem; margin-top: 10px;">Check browser console for details.</p></div>`;
    }
}

function displayStaff(staff) {
    const container = document.getElementById('nonTeachingStaffContainer');
    
    if (staff.length > 0) {
        container.innerHTML = staff.map((person, index) => {
            // Clean up the name from filename if needed
            let displayName = person.full_name;
            if (displayName.includes('.')) {
                // Extract caption or create a cleaner name
                displayName = displayName.split('.')[0].replace(/_/g, ' ').replace(/\d+/g, '').trim();
            }
            
            return `
            <div class="staff-item" data-aos="fade-up" data-aos-delay="${Math.min(index * 50, 500)}">
                <div class="image-wrapper">
                    <img src="nyabzgallery/${person.photo}" 
                         alt="${displayName}"
                         onerror="this.src='nyabzgallery/default.svg'"
                         loading="lazy">
                </div>
                <h3>${displayName}</h3>
                <span class="badge">Support Staff</span>
            </div>
        `;
        }).join('');
        
        // Reinitialize AOS for new elements
        if (typeof AOS !== 'undefined') {
            AOS.refresh();
        }
    } else {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No staff match your search.</p></div>';
    }
}

function updateStatistics(staff) {
    const total = staff.length;
    
    // Update all stat cards with the same total count
    const totalElement = document.getElementById('totalStaff');
    const adminElement = document.getElementById('adminStaff');
    
    if (totalElement) totalElement.textContent = total;
    if (adminElement) adminElement.textContent = total;
}

function handleSearch() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    
    if (searchTerm === '') {
        displayStaff(allStaff);
        return;
    }
    
    const filtered = allStaff.filter(person => 
        person.full_name.toLowerCase().includes(searchTerm) ||
        (person.subject && person.subject.toLowerCase().includes(searchTerm)) ||
        (person.email && person.email.toLowerCase().includes(searchTerm)) ||
        (person.phone && person.phone.includes(searchTerm))
    );
    
    displayStaff(filtered);
}

// Allow search on Enter key
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    }
});
</script>

<script>
        
    function showMenu() {
        document.getElementById('navlinks').style.right = "0";
    }

    function hideMenu() {
        document.getElementById('navlinks').style.right = "-200px";
    }


    </script>

  new WOW().init();
</script>

<script>
    function scrollToTop() {
window.scrollTo({
    top: 0, // Scroll to the top of the page
    behavior: 'smooth' // Smooth scrolling animation
});
}

// Show/hide back to top button based on scroll position
window.addEventListener('scroll', function() {
  const backToTopButton = document.getElementById('backToTop');
  if (backToTopButton) {
    if (window.pageYOffset > 300) {
      backToTopButton.classList.add('show');
    } else {
      backToTopButton.classList.remove('show');
    }
  }
});

</script>

<script>
    function toggleFab() {
      const fabOptions = document.querySelector('.fab-options');
      fabOptions.classList.toggle('show');
    }
    </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Add scroll event listener with throttling for smoother animation
    let lastScrollTop = 0;
    const scrollThreshold = 100;
    let ticking = false;

    window.addEventListener('scroll', function() {
        if (!ticking) {
            window.requestAnimationFrame(function() {
                const topbar = document.querySelector('.topbar');
                const navbar = document.querySelector('.navbar');
                const scrollPosition = window.scrollY;
                
                // Determine scroll direction
                const scrollDirection = scrollPosition > lastScrollTop ? 'down' : 'up';
                
                if (scrollPosition > scrollThreshold) {
                    if (scrollDirection === 'down') {
                        topbar.classList.add('hide');
                        navbar.classList.add('show');
                    } else {
                        topbar.classList.remove('hide');
                        navbar.classList.remove('show');
                    }
                } else {
                    topbar.classList.remove('hide');
                    navbar.classList.remove('show');
                }
                
                lastScrollTop = scrollPosition;
                ticking = false;
            });
            
            ticking = true;
        }
    });
</script>
<!-- Add AOS JS and initialize at the end of the body -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 900,
    easing: 'ease-in-out',
    once: true
  });
</script>
<script src="js/includes.js"></script>
